# Contract-suite wiring for zerodha, read by tests/test_contract_suite.py.
# Importable "module:attr" hooks, then the recorded read routes.
adapter = "honba_zerodha:ZerodhaAdapter"
config = "honba_zerodha:ZerodhaConfig"  # must provide .paper()
fallback = "honba_zerodha:make_zerodha_mock_handler"  # in-memory handler for the stateful order lifecycle

# path fragment -> fixture file in this directory. The longest matching fragment wins,
# so map order does not matter.
[routes]
"/user/margins" = "margins.json"
"/margins/orders" = "order_margins.json"
"/quote" = "quote.json"
"/instruments/historical" = "historical.json"
"/instruments" = "instruments.csv"
"/trades" = "trades.json"
"/portfolio/positions" = "positions.json"
"/portfolio/holdings" = "holdings.json"
"/session/token" = "token.json"
