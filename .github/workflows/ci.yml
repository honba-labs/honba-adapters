name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: install deps
        run: |
          python -m pip install --upgrade pip
          [ -f requirements.txt ] && pip install -r requirements.txt || true
          [ -f requirements-dev.txt ] && pip install -r requirements-dev.txt || true
          pip install pytest
      - name: syntax check all sources
        run: |
          find . -name '*.py' -not -path './.venv/*' -print0 \
            | xargs -0 -r -n1 python -m py_compile
      - name: pytest
        run: |
          if [ -d tests ]; then pytest -q tests/; else echo "no tests dir"; fi
